[project]
name = "Xartus"
version = "0.4.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dask>=2026.3.0",
    "argsui @ https://github.com/rosalindfranklininstitute/argsUI/releases/download/v0.2.0/argsui-0.2.0.tar.gz#sha256:881398964919fa054721fe42da582937d2f0230f8b27152232cbfb09670b2f63",
    "h5py>=3.15.1",
    "matplotlib>=3.10.8",
    "nexusformat>=2.0.1",
    "numpy>=2.4.2",
    "sparse>=0.18.0",
    "numpy>=2.4.6",
    "tqdm>=4.67.3",
    "xarray>=2026.7.0",
]
license = "LicenseRef-RFI-Apache-2.0-Commons-clause"
license-files = ["LICENSES/*"]

[dependency-groups]
dev = [
    "line-profiler>=5.0.1",
    "pytest>=9.0.2",
    "pytest-autoprofile>=0.19.0",
    "pytest-cov>=7.0.0",
    "pytest-local-badge>=1.3.1",
    "hypothesis>=6.151.7",
    "snakeviz>=2.2.2",
    "pillow>=12.1.1",
    "nexus_pixel_man_test_data",
    "icecream>=2.1.10",
    "pre-commit>=4.6.2",
]
doc = [
    "myst-parser>=5.1.0",
    "sphinx-rtd-theme>=3.1.0",
    "sphinx-autodoc-typehints>=3.13.2",
    "myst-nb>=1.4.0",
]

[project.scripts]
profile = "xartus:profile"
compound = "xartus:compound"
massimage = "xartus:massimage"
specimage = "xartus:specimage"
inspect = "xartus:inspect"
nx_density = "xartus:print_nx_data_stats"
test = "xartus:test"
query = "xartus:query"
bulk_query = "xartus:bulk_query"

[project.entry-points."xarray.backends"]
nexus = "xartus.lib.xarray_backend:NexusEntrypoint"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"


[tool.uv]
default-groups = ['dev', 'doc']

[tool.uv.sources]
argsui = { path = "../argsui", editable = true }
nexus_pixel_man_test_data = { path = "../nexus_pixel_man_test_data/", editable = true }

[tool.ruff]
indent-width=4

[tool.ruff.lint]
select=['E1', 'E4','E7','E9','F','N','ERA', 'ANN2', 'S', 'BLE', 'B', 'A', 'C4', 'COM', 'ISC', 'ICN', 'LOG', 'PIE','RET', 'SLF','SIM', 'TD', 'ARG', 'PTH', 'FLY', 'NPY', 'PERF', "D2", "TRY", "PT"]
ignore=["C408", "S311", "PTH123", "NPY002", "D203", "D205", "D212", "B006", "ARG001", "ARG002", "D200", "ANN204", "S101", "TRY003", 'RET504', 'COM812', 'PT012']
# From some modules: T20 -. Print   

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["ANN", "S101"]
"benchmarks/**/*" = ["ANN", "S101"]

[tool.pytest]
testpaths = ["./tests", "./src/"]
addopts = [
    "--doctest-modules", 
    "--cov=./src/", 
    "--cov-report=html", 
    "--cov-branch",
    "--local-badge-output-dir=badges",
    "--local-badge-package=xartus",
]

[tool.line_profiler.kernprof]
line-by-line = true
verbose = false
skip-zero = true
prof-mod = [ 'tmp.py', 'xartus']
prof-imports = true


[tool.ty.analysis]
allowed-unresolved-imports = ["nexusformat.nexus.tree.NXparameters" ,"nexusformat.nexus.tree.NXinstrument"]

[tool.typos.default.extend-identifiers]
fle = 'fle'

[tool.typos.default]
extend-ignore-re = [ 
                    ">\\w+(\\s|<[^/])",
                    "np.arange",
                   ] # Ignore words that are cut by html tags.

[tool.bumpversion]
current_version = "0.4.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
push_tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} -> {new_version}"
allow_dirty = false
commit = true
message = "Bump version to {new_version}: {distance_to_latest_tag} commits since {current_version}"
moveable_tags = []
commit_args = ''
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []
allow_shell_hooks = false
